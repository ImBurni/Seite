<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Updates · ImBurniBot</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255, 80, 0, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(255, 150, 0, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 100, 0, 0.10);
        }

        .back-link {
            color: #8a7a70;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover { color: #ff8c00; }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6a00, #ff4500, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Update Einträge */
        .update-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .update-card {
            background: rgba(255, 60, 0, 0.04);
            border: 1px solid rgba(255, 100, 0, 0.08);
            border-radius: 20px;
            padding: 24px 28px;
            transition: all 0.3s ease;
            border-left: 4px solid #ff6a00;
        }
        .update-card:hover {
            border-color: rgba(255, 150, 0, 0.25);
            transform: translateX(6px);
        }

        .update-card .version {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ff8c00;
            display: inline-block;
            margin-right: 12px;
        }

        .update-card .date {
            font-size: 0.85rem;
            color: #665a50;
        }

        .update-card .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f0e0d0;
            margin: 6px 0 8px;
        }

        .update-card .changes {
            list-style: none;
            padding: 0;
        }
        .update-card .changes li {
            padding: 4px 0 4px 24px;
            position: relative;
            color: #b0a098;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .update-card .changes li::before {
            content: '🔥';
            position: absolute;
            left: 0;
            top: 4px;
            font-size: 0.8rem;
        }
        .update-card .changes li.added::before { content: '✅'; }
        .update-card .changes li.fixed::before { content: '🔧'; }
        .update-card .changes li.removed::before { content: '🗑️'; }
        .update-card .changes li.updated::before { content: '🔄'; }

        .update-card .tag {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }
        .update-card .tag.stable { background: rgba(0, 255, 136, 0.12); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.15); }
        .update-card .tag.beta { background: rgba(255, 204, 0, 0.12); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.15); }
        .update-card .tag.hotfix { background: rgba(255, 68, 68, 0.12); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.15); }

        /* Footer */
        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.85rem;
            color: #5a4a40;
            border-top: 1px solid rgba(255, 100, 0, 0.06);
            padding-top: 30px;
        }
        .footer a { color: #8a7a70; text-decoration: none; transition: color 0.2s; }
        .footer a:hover { color: #ff8c00; }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .update-card { padding: 18px 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Zurück</a>
            <h1><i class="fas fa-sync-alt" style="color: #ff6a00; -webkit-text-fill-color: #ff6a00;"></i> Updates &amp; Changelog</h1>
        </div>

        <!-- Update Liste -->
        <div class="update-list" id="updateList">
            <!-- Wird per JS befüllt -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            <a href="index.html"><i class="fas fa-home"></i> Zurück zur Hauptseite</a>
        </footer>
    </div>

    <script>

                    tag: 'stable',

                    changes: [
                        { type: 'added', text: 'Zentrales Wartungssystem mit !wartungen' },

                {

            ];

            // ============================================================
            // RENDER FUNKTION
            // ============================================================
            function renderUpdates() {
                const container = document.getElementById('updateList');

                container.innerHTML = updates.map(update => `
                    <div class="update-card">
                        <div>
                            <span class="version">${update.version}</span>
                            <span class="date"><i class="far fa-calendar-alt"></i> ${update.date}</span>
                            <span class="tag ${update.tag}">${update.tagLabel}</span>
                        </div>
                        <div class="title">${update.title}</div>
                        <ul class="changes">
                            ${update.changes.map(c => `
                                <li class="${c.type}">${c.text}</li>
                            `).join('')}
                        </ul>
                    </div>
                `).join('');
            }

            renderUpdates();

            console.log('📋 Update-Seite geladen!');

    </script>
</body>
</html>
