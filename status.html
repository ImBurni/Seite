<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bot-Status · ImBurniBot</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255, 80, 0, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(255, 150, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(200, 50, 0, 0.10) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: firePulse 4s ease-in-out infinite alternate;
        }
        @keyframes firePulse {
            0% { opacity: 0.8; }
            100% { opacity: 1.2; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 100, 0, 0.10);
        }

        .back-link {
            color: #8a7a70;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover { color: #ff8c00; }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6a00, #ff4500, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bot-status-card {
            background: rgba(255, 60, 0, 0.04);
            border: 1px solid rgba(255, 100, 0, 0.12);
            border-radius: 32px;
            padding: 40px 36px;
            margin-bottom: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .bot-status-card:hover {
            border-color: rgba(255, 150, 0, 0.25);
            transform: translateY(-4px);
        }

        .bot-status-card .bot-icon {
            font-size: 4rem;
            margin-bottom: 12px;
        }
        .bot-status-card .bot-icon.green { color: #00ff88; }
        .bot-status-card .bot-icon.red { color: #ff4444; }
        .bot-status-card .bot-icon.yellow { color: #ffcc00; }

        .bot-status-card .bot-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f0e0d0;
        }

        .bot-status-card .bot-status-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .bot-status-card .bot-status-text.online { color: #00ff88; }
        .bot-status-card .bot-status-text.offline { color: #ff4444; }
        .bot-status-card .bot-status-text.warning { color: #ffcc00; }

        .bot-status-card .bot-badge {
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .bot-status-card .bot-badge.green { background: rgba(0, 255, 136, 0.12); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.15); }
        .bot-status-card .bot-badge.red { background: rgba(255, 68, 68, 0.12); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.15); }
        .bot-status-card .bot-badge.yellow { background: rgba(255, 204, 0, 0.12); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.15); }

        .bot-status-card .bot-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 16px;
            font-size: 0.9rem;
            color: #8a7a70;
        }
        .bot-status-card .bot-details span i { color: #ff6a00; margin-right: 6px; }

        .api-section {
            margin-top: 10px;
        }

        .api-section .api-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #8a7a70;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 100, 0, 0.06);
            padding-bottom: 10px;
        }

        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .api-item {
            background: rgba(255, 60, 0, 0.03);
            border: 1px solid rgba(255, 100, 0, 0.06);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
        }
        .api-item:hover {
            border-color: rgba(255, 150, 0, 0.15);
        }

        .api-item .api-icon {
            font-size: 1.3rem;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        .api-item .api-icon.green { color: #00ff88; }
        .api-item .api-icon.red { color: #ff4444; }
        .api-item .api-icon.yellow { color: #ffcc00; }

        .api-item .api-info {
            flex: 1;
            min-width: 0;
        }
        .api-item .api-info .api-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f0e0d0;
        }
        .api-item .api-info .api-status {
            font-size: 0.75rem;
            color: #8a7a70;
        }
        .api-item .api-info .api-status .online { color: #00ff88; }
        .api-item .api-info .api-status .offline { color: #ff4444; }

        .api-item .api-badge {
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 10px;
            border-radius: 40px;
            flex-shrink: 0;
        }
        .api-item .api-badge.green { background: rgba(0, 255, 136, 0.10); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.08); }
        .api-item .api-badge.red { background: rgba(255, 68, 68, 0.10); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.08); }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: #5a4a40;
            border-top: 1px solid rgba(255, 100, 0, 0.06);
            padding-top: 30px;
        }
        .footer a { color: #8a7a70; text-decoration: none; transition: color 0.2s; }
        .footer a:hover { color: #ff8c00; }

        .last-updated {
            font-size: 0.75rem;
            color: #5a4a40;
            margin-top: 8px;
        }

        .loading-text {
            text-align: center;
            color: #8a7a70;
            padding: 20px;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .bot-status-card { padding: 28px 20px; }
            .bot-status-card .bot-icon { font-size: 3rem; }
            .bot-status-card .bot-name { font-size: 1.4rem; }
            .bot-status-card .bot-status-text { font-size: 1.1rem; }
            .bot-status-card .bot-details { gap: 14px; font-size: 0.8rem; }
            .api-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Zurück</a>
            <h1><i class="fas fa-server" style="color: #ff6a00; -webkit-text-fill-color: #ff6a00;"></i> Bot-Status</h1>
        </div>

        <div class="bot-status-card" id="botStatusCard"></div>

        <div class="api-section">
            <div class="api-title"><i class="fas fa-plug"></i> Öffentliche API-Status</div>
            <div class="api-grid" id="apiGrid">
                <div class="loading-text"><i class="fas fa-spinner fa-spin"></i> Lade API-Status...</div>
            </div>
        </div>

        <footer class="footer">
            <a href="index.html"><i class="fas fa-home"></i> Zurück zur Hauptseite</a>
            <div class="last-updated" id="lastUpdated">🔄 Wird geladen…</div>
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // BOT-STATUS (wird vom Plugin überschrieben)
            // ============================================================
            const botStatus = {
    name: 'ImBurniBot',
    status: 'online',
    uptime: 'Aktiv',
    version: 'v2.4.1',
    lastRestart: '24.08.2026, 23:41 Uhr'
};

            // ============================================================
            // API STATUS CHECKS
            // ============================================================

            async function checkSpotifyStatus() {
                try {
                    const res = await fetch('https://api.spotify.com/v1/search?q=test&type=track&limit=1', {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    if (res.status === 200 || res.status === 401 || res.status === 403) {
                        return {
                            name: 'Spotify',
                            icon: 'fa-spotify',
                            status: 'online',
                            detail: 'API erreichbar',
                            badge: 'green',
                            badgeText: 'Online'
                        };
                    } else {
                        return {
                            name: 'Spotify',
                            icon: 'fa-spotify',
                            status: 'offline',
                            detail: `Status: ${res.status}`,
                            badge: 'red',
                            badgeText: 'Offline'
                        };
                    }
                } catch {
                    return {
                        name: 'Spotify',
                        icon: 'fa-spotify',
                        status: 'offline',
                        detail: 'Nicht erreichbar',
                        badge: 'red',
                        badgeText: 'Offline'
                    };
                }
            }

            async function checkDatabaseStatus() {
                try {
                    const start = Date.now();
                    const res = await fetch('https://api.github.com/rate_limit', {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });
                    const ping = Date.now() - start;
                    
                    if (res.status === 200) {
                        return {
                            name: 'Datenbank',
                            icon: 'fa-database',
                            status: 'online',
                            detail: `${ping}ms Ping`,
                            badge: 'green',
                            badgeText: 'Online'
                        };
                    } else {
                        return {
                            name: 'Datenbank',
                            icon: 'fa-database',
                            status: 'offline',
                            detail: `Status: ${res.status}`,
                            badge: 'red',
                            badgeText: 'Offline'
                        };
                    }
                } catch {
                    return {
                        name: 'Datenbank',
                        icon: 'fa-database',
                        status: 'offline',
                        detail: 'Nicht erreichbar',
                        badge: 'red',
                        badgeText: 'Offline'
                    };
                }
            }

            // ============================================================
            // RENDER
            // ============================================================

            function renderBotStatus() {
                const card = document.getElementById('botStatusCard');

                const statusMap = {
                    'online': { icon: 'green', text: '🟢 Online', class: 'online', badge: 'green', badgeText: 'Aktiv' },
                    'offline': { icon: 'red', text: '🔴 Offline', class: 'offline', badge: 'red', badgeText: 'Inaktiv' },
                    'warning': { icon: 'yellow', text: '🟡 Achtung', class: 'warning', badge: 'yellow', badgeText: 'Warnung' }
                };

                const s = statusMap[botStatus.status] || statusMap['online'];

                card.innerHTML = `
                    <div class="bot-icon ${s.icon}"><i class="fas fa-robot"></i></div>
                    <div class="bot-name">${botStatus.name}</div>
                    <div class="bot-status-text ${s.class}">${s.text}</div>
                    <span class="bot-badge ${s.badge}">${s.badgeText}</span>
                    <div class="bot-details">
                        <span><i class="fas fa-clock"></i> Uptime: ${botStatus.uptime}</span>
                        <span><i class="fas fa-tag"></i> Version: ${botStatus.version}</span>
                        <span><i class="fas fa-redo"></i> Neustart: ${botStatus.lastRestart}</span>
                    </div>
                `;
            }

            function renderApiStatus(apis) {
                const grid = document.getElementById('apiGrid');

                grid.innerHTML = apis.map(api => `
                    <div class="api-item">
                        <div class="api-icon ${api.status === 'online' ? 'green' : 'red'}">
                            <i class="fab ${api.icon}"></i>
                        </div>
                        <div class="api-info">
                            <div class="api-name">${api.name}</div>
                            <div class="api-status">
                                <span class="${api.status}">${api.status === 'online' ? '🟢 Online' : '🔴 Offline'}</span>
                                <span style="color: #665a50; margin-left: 6px;">· ${api.detail}</span>
                            </div>
                        </div>
                        <span class="api-badge ${api.badge}">${api.badgeText}</span>
                    </div>
                `).join('');
            }

            // ============================================================
            // UPDATE
            // ============================================================

            async function updateAllStatus() {
                try {
                    const [spotify, database] = await Promise.all([
                        checkSpotifyStatus(),
                        checkDatabaseStatus()
                    ]);

                    renderBotStatus();
                    renderApiStatus([spotify, database]);

                    const now = new Date();
                    document.getElementById('lastUpdated').textContent =
                        `🔄 Zuletzt aktualisiert: ${now.toLocaleString('de-DE')}`;

                } catch (error) {
                    console.error('Fehler:', error);
                    document.getElementById('lastUpdated').textContent = '⚠️ Fehler beim Aktualisieren';
                }
            }

            // ============================================================
            // START
            // ============================================================

            renderBotStatus();
            updateAllStatus();
            setInterval(updateAllStatus, 30000);

            console.log('📊 Bot-Status Seite geladen!');
        })();
    </script>

</body>
</html>
