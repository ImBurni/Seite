<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bot-Status · ImBurniBot</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255, 80, 0, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(255, 150, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(200, 50, 0, 0.10) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: firePulse 4s ease-in-out infinite alternate;
        }
        @keyframes firePulse {
            0% { opacity: 0.8; }
            100% { opacity: 1.2; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 100, 0, 0.10);
        }

        .back-link {
            color: #8a7a70;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover { color: #ff8c00; }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6a00, #ff4500, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .status-card {
            background: rgba(255, 60, 0, 0.04);
            border: 1px solid rgba(255, 100, 0, 0.08);
            border-radius: 24px;
            padding: 28px 24px;
            transition: all 0.3s ease;
        }
        .status-card:hover {
            border-color: rgba(255, 150, 0, 0.20);
            transform: translateY(-4px);
        }

        .status-card .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: inline-block;
        }
        .status-card .icon.green { color: #00ff88; }
        .status-card .icon.red { color: #ff4444; }
        .status-card .icon.yellow { color: #ffcc00; }
        .status-card .icon.gray { color: #665a50; }

        .status-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f0e0d0;
            margin-bottom: 4px;
        }

        .status-card .status-text {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 6px 0 4px;
        }
        .status-card .status-text.online { color: #00ff88; }
        .status-card .status-text.offline { color: #ff4444; }
        .status-card .status-text.warning { color: #ffcc00; }

        .status-card .detail {
            font-size: 0.8rem;
            color: #8a7a70;
            margin-top: 8px;
            border-top: 1px solid rgba(255, 100, 0, 0.06);
            padding-top: 10px;
        }

        .status-card .detail span {
            display: inline-block;
            margin-right: 16px;
        }
        .status-card .detail i { width: 16px; color: #ff6a00; }

        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .badge.green { background: rgba(0, 255, 136, 0.12); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.15); }
        .badge.red { background: rgba(255, 68, 68, 0.12); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.15); }
        .badge.yellow { background: rgba(255, 204, 0, 0.12); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.15); }
        .badge.gray { background: rgba(255, 255, 255, 0.04); color: #665a50; border: 1px solid rgba(255, 255, 255, 0.06); }

        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.85rem;
            color: #5a4a40;
            border-top: 1px solid rgba(255, 100, 0, 0.06);
            padding-top: 30px;
        }
        .footer a { color: #8a7a70; text-decoration: none; transition: color 0.2s; }
        .footer a:hover { color: #ff8c00; }

        .last-updated {
            font-size: 0.75rem;
            color: #5a4a40;
            margin-top: 8px;
        }

        .status-loading {
            text-align: center;
            padding: 40px;
            color: #8a7a70;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .status-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Zurück</a>
            <h1><i class="fas fa-server" style="color: #ff6a00; -webkit-text-fill-color: #ff6a00;"></i> Bot-Status</h1>
        </div>

        <div class="status-grid" id="statusGrid">
            <div class="status-loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i>
                <p style="margin-top: 12px;">Lade Status...</p>
            </div>
        </div>

        <footer class="footer">
            <a href="index.html"><i class="fas fa-home"></i> Zurück zur Hauptseite</a>
            <div class="last-updated" id="lastUpdated">🔄 Wird geladen…</div>
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // BOT-STATUS (wird vom Plugin gesetzt - NUR DAS WIRD GEÄNDERT!)
            // ============================================================
            const statusData = {
                bot: {
        name: 'ImBurniBot',
        status: 'warning',
        uptime: 'Aktiv',
        version: 'v2.4.1',
        lastRestart: '07.08.2026, 16:58 Uhr'
    }
            };

            // ============================================================
            // ÖFFENTLICHE API STATUS CHECKS
            // ============================================================

            async function checkTwitchStatus() {
                try {
                    const [uptimeRes, viewersRes] = await Promise.all([
                        fetch('https://decapi.me/twitch/uptime/imburni', { cache: 'no-store' }),
                        fetch('https://decapi.me/twitch/viewercount/imburni', { cache: 'no-store' })
                    ]);

                    const uptime = await uptimeRes.text();
                    const viewers = await viewersRes.text();

                    const isLive = uptime && !uptime.toLowerCase().includes('offline') && !uptime.includes('404');
                    const viewerCount = parseInt(viewers) || 0;

                    return {
                        status: isLive ? 'online' : 'offline',
                        connected: true,
                        channel: 'ImBurni',
                        viewers: isLive ? `${viewerCount}` : 'Offline',
                        detail: isLive ? `🟢 LIVE (${viewerCount} Viewer)` : '🔴 Offline'
                    };
                } catch (error) {
                    return {
                        status: 'offline',
                        connected: false,
                        channel: 'ImBurni',
                        viewers: 'Fehler',
                        detail: '❌ API nicht erreichbar'
                    };
                }
            }

            async function checkSpotifyStatus() {
                try {
                    // Öffentlicher Spotify Web API Status
                    // Wir prüfen den Status der Spotify API
                    const res = await fetch('https://api.spotify.com/v1/search?q=test&type=track&limit=1', {
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    if (res.status === 200) {
                        return {
                            status: 'online',
                            connected: true,
                            currentSong: '✅ API erreichbar',
                            device: 'Public API',
                            detail: '🟢 API erreichbar'
                        };
                    } else if (res.status === 401 || res.status === 403) {
                        return {
                            status: 'warning',
                            connected: false,
                            currentSong: '🟡 API benötigt Auth',
                            device: 'Public API',
                            detail: '🟡 Authentifizierung erforderlich'
                        };
                    } else {
                        return {
                            status: 'offline',
                            connected: false,
                            currentSong: '❌ API nicht erreichbar',
                            device: 'Public API',
                            detail: `🔴 Status: ${res.status}`
                        };
                    }
                } catch (error) {
                    return {
                        status: 'offline',
                        connected: false,
                        currentSong: '❌ API nicht erreichbar',
                        device: 'Public API',
                        detail: '🔴 Spotify API offline'
                    };
                }
            }

            async function checkDiscordStatus() {
                try {
                    // Öffentlicher Discord Server Widget
                    const res = await fetch('https://discord.com/api/v10/guilds/744192376393957396/widget.json', {
                        cache: 'no-store'
                    });
                    
                    if (res.status === 200) {
                        const data = await res.json();
                        const members = data.members ? data.members.length : 0;
                        const presence = data.presence_count || 0;
                        return {
                            status: 'online',
                            connected: true,
                            server: 'ImBurni Community',
                            members: `${members} Mitglieder (${presence} online)`,
                            detail: `🟢 Online (${members} Mitglieder)`
                        };
                    } else if (res.status === 404) {
                        return {
                            status: 'offline',
                            connected: false,
                            server: 'Widget deaktiviert',
                            members: '-',
                            detail: '🔴 Discord Widget deaktiviert'
                        };
                    } else {
                        return {
                            status: 'warning',
                            connected: false,
                            server: 'API Fehler',
                            members: '-',
                            detail: `🟡 Status: ${res.status}`
                        };
                    }
                } catch (error) {
                    return {
                        status: 'offline',
                        connected: false,
                        server: 'Nicht erreichbar',
                        members: '-',
                        detail: '🔴 Discord API offline'
                    };
                }
            }

            async function checkDatabaseStatus() {
                try {
                    // GitHub API Status (Datenbank-Server)
                    const start = Date.now();
                    const res = await fetch('https://api.github.com/rate_limit', {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });
                    const ping = Date.now() - start;
                    
                    if (res.status === 200) {
                        return {
                            status: 'online',
                            connected: true,
                            lastSync: `${ping}ms Ping`,
                            detail: `🟢 Online (${ping}ms)`
                        };
                    } else {
                        return {
                            status: 'warning',
                            connected: false,
                            lastSync: `Status: ${res.status}`,
                            detail: `🟡 Status: ${res.status}`
                        };
                    }
                } catch (error) {
                    return {
                        status: 'offline',
                        connected: false,
                        lastSync: '❌ Nicht erreichbar',
                        detail: '🔴 GitHub API offline'
                    };
                }
            }

            // ============================================================
            // RENDER FUNKTION
            // ============================================================

            function renderStatus(twitch, spotify, discord, database) {
                const grid = document.getElementById('statusGrid');

                const botStatus = statusData.bot.status || 'online';
                const botMap = {
                    'online': { icon: 'green', text: '🟢 Online', class: 'online', badge: 'green', badgeText: 'Aktiv' },
                    'offline': { icon: 'red', text: '🔴 Offline', class: 'offline', badge: 'red', badgeText: 'Inaktiv' },
                    'warning': { icon: 'yellow', text: '🟡 Achtung', class: 'warning', badge: 'yellow', badgeText: 'Warnung' }
                };
                const bot = botMap[botStatus] || botMap['online'];

                const cards = [
                    {
                        icon: 'fa-robot',
                        iconColor: bot.icon,
                        title: '🤖 Bot',
                        status: bot.text,
                        statusClass: bot.class,
                        badge: bot.badge,
                        badgeText: bot.badgeText,
                        details: [
                            { icon: 'fa-clock', text: `Uptime: ${statusData.bot.uptime || 'Aktiv'}` },
                            { icon: 'fa-tag', text: `Version: ${statusData.bot.version || 'v2.4.1'}` },
                            { icon: 'fa-redo', text: `Neustart: ${statusData.bot.lastRestart || '-'}` }
                        ]
                    },
                    {
                        icon: 'fa-spotify',
                        iconColor: spotify.status === 'online' ? 'green' : spotify.status === 'warning' ? 'yellow' : 'red',
                        title: '🎵 Spotify',
                        status: spotify.connected ? '🟢 Online' : '🔴 Offline',
                        statusClass: spotify.connected ? 'online' : 'offline',
                        badge: spotify.connected ? 'green' : 'red',
                        badgeText: spotify.connected ? 'Online' : 'Offline',
                        details: [
                            { icon: 'fa-music', text: `Status: ${spotify.currentSong || '-'}` },
                            { icon: 'fa-device', text: `API: ${spotify.device || '-'}` }
                        ]
                    },
                    {
                        icon: 'fa-twitch',
                        iconColor: twitch.status === 'online' ? 'green' : 'red',
                        title: '📺 Twitch',
                        status: twitch.connected ? '🟢 Online' : '🔴 Offline',
                        statusClass: twitch.connected ? 'online' : 'offline',
                        badge: twitch.connected ? 'green' : 'red',
                        badgeText: twitch.connected ? 'Online' : 'Offline',
                        details: [
                            { icon: 'fa-user', text: `Channel: ${twitch.channel || '-'}` },
                            { icon: 'fa-eye', text: `Viewer: ${twitch.viewers || '-'}` }
                        ]
                    },
                    {
                        icon: 'fa-discord',
                        iconColor: discord.status === 'online' ? 'green' : discord.status === 'warning' ? 'yellow' : 'red',
                        title: '💬 Discord',
                        status: discord.connected ? '🟢 Online' : '🔴 Offline',
                        statusClass: discord.connected ? 'online' : 'offline',
                        badge: discord.connected ? 'green' : 'red',
                        badgeText: discord.connected ? 'Online' : 'Offline',
                        details: [
                            { icon: 'fa-server', text: `Server: ${discord.server || '-'}` },
                            { icon: 'fa-users', text: `Mitglieder: ${discord.members || '-'}` }
                        ]
                    },
                    {
                        icon: 'fa-database',
                        iconColor: database.status === 'online' ? 'green' : 'red',
                        title: '🗄️ Datenbank',
                        status: database.connected ? '🟢 Online' : '🔴 Offline',
                        statusClass: database.connected ? 'online' : 'offline',
                        badge: database.connected ? 'green' : 'red',
                        badgeText: database.connected ? 'Online' : 'Offline',
                        details: [
                            { icon: 'fa-sync', text: `Status: ${database.lastSync || '-'}` }
                        ]
                    }
                ];

                grid.innerHTML = cards.map(card => `
                    <div class="status-card">
                        <div class="icon ${card.iconColor}"><i class="fab ${card.icon}"></i></div>
                        <h3>${card.title}</h3>
                        <div class="status-text ${card.statusClass}">${card.status}</div>
                        <span class="badge ${card.badge}">${card.badgeText}</span>
                        <div class="detail">
                            ${card.details.map(d => `<span><i class="fas ${d.icon}"></i> ${d.text}</span>`).join('')}
                        </div>
                    </div>
                `).join('');

                const now = new Date();
                document.getElementById('lastUpdated').textContent =
                    `🔄 Zuletzt aktualisiert: ${now.toLocaleString('de-DE')}`;
            }

            // ============================================================
            // UPDATE ALLE 30 SEKUNDEN
            // ============================================================

            async function updateAllStatus() {
                try {
                    const [twitch, spotify, discord, database] = await Promise.all([
                        checkTwitchStatus(),
                        checkSpotifyStatus(),
                        checkDiscordStatus(),
                        checkDatabaseStatus()
                    ]);

                    renderStatus(twitch, spotify, discord, database);

                } catch (error) {
                    console.error('Fehler beim Updaten:', error);
                    document.getElementById('lastUpdated').textContent = '⚠️ Fehler beim Aktualisieren';
                }
            }

            // ============================================================
            // START
            // ============================================================

            updateAllStatus();
            setInterval(updateAllStatus, 30000);

            console.log('📊 Bot-Status Seite mit öffentlichen APIs geladen!');
        })();
    </script>

</body>
</html>
